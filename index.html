
<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Youtube Music Player</h1>
    <p>Your personal soundtrack collection.</p>

    
    
<div class="music-player">

    <!-- LEFT SIDE: PLAYLIST -->
    <section class="playlist-panel">

        <h2>Your Playlist</h2>

        <div class="playlist-controls">
            <button id="shuffleButton">Shuffle: OFF</button>
            <button id="nextButton">Next Song</button>
            <button id="importButton">Import Playlist</button>
            <button id="exportButton">Export Playlist</button>
        </div>

        <input
            type="file"
            id="importFile"
            accept=".txt,text/plain"
            hidden
        >

        <div class="playlist-scroll">
            <ul id="playlist"></ul>
        </div>

    </section>

    <!-- RIGHT SIDE: PLAYER -->
    <section class="player-panel">

        <h2>Now Playing</h2>

        <div id="videoContainer">
            <div id="youtubePlayer"></div>
        </div>

        <h2>Add a Song</h2>

        <div class="song-input">
            <input
                type="text"
                id="youtubeURL"
                placeholder="Paste YouTube URL here"
            >

            <button id="playButton">Load Video</button>
        </div>

    </section>

</div>


    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>

</body>
</html>
